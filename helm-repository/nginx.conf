server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        default_type text/plain;
        return 200 "LLM Proxy Helm repository\n";
    }

    location = /index.yaml {
        default_type application/yaml;
        try_files $uri =404;
    }

    location ~ \.tgz$ {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
