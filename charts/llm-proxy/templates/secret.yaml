{{- if and (not .Values.secrets.existingSecret) (not .Values.postgresql.externalSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-proxy.fullname" . }}-secrets
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "llm-proxy.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required when bundled PostgreSQL is enabled" .Values.postgresql.password | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ required "secrets.values.authSecret is required when existingSecret is empty" .Values.secrets.values.authSecret | quote }}
  OIDC_CLIENT_ID: {{ required "secrets.values.oidcClientId is required when existingSecret is empty" .Values.secrets.values.oidcClientId | quote }}
  OIDC_CLIENT_SECRET: {{ required "secrets.values.oidcClientSecret is required when existingSecret is empty" .Values.secrets.values.oidcClientSecret | quote }}
  AWS_ACCESS_KEY_ID: {{ required "secrets.values.awsAccessKeyId is required when existingSecret is empty" .Values.secrets.values.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.values.awsSecretAccessKey is required when existingSecret is empty" .Values.secrets.values.awsSecretAccessKey | quote }}
  AWS_SESSION_TOKEN: {{ .Values.secrets.values.awsSessionToken | quote }}
{{- end }}
