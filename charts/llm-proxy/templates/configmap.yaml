apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-proxy.fullname" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
data:
  BASE_URL: {{ .Values.config.baseUrl | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  OIDC_ISSUER: {{ .Values.config.oidc.issuer | quote }}
  {{- if .Values.config.oidc.discoveryUrl }}
  OIDC_DISCOVERY_URL: {{ .Values.config.oidc.discoveryUrl | quote }}
  {{- end }}
  OIDC_PROVIDER_ID: {{ .Values.config.oidc.providerId | quote }}
  OIDC_PROVIDER_LABEL: {{ .Values.config.oidc.providerLabel | quote }}
  OIDC_SCOPES: {{ .Values.config.oidc.scopes | quote }}
  OIDC_PKCE: {{ .Values.config.oidc.pkce | quote }}
  OIDC_STRICT_ISSUER_VALIDATION: {{ .Values.config.oidc.strictIssuerValidation | quote }}
  BOOTSTRAP_ADMIN_SUBJECTS: {{ .Values.config.bootstrapAdminSubjects | quote }}
  BOOTSTRAP_ADMIN_EMAILS: {{ .Values.config.bootstrapAdminEmails | quote }}
  BRAND_NAME: {{ .Values.config.brand.name | quote }}
  BRAND_TAGLINE: {{ .Values.config.brand.tagline | quote }}
  BRAND_LOGO_URL: {{ .Values.config.brand.logoUrl | quote }}
  BRAND_FAVICON_URL: {{ .Values.config.brand.faviconUrl | quote }}
  BRAND_PRIMARY_COLOR: {{ .Values.config.brand.primaryColor | quote }}
  BRAND_PRIMARY_FOREGROUND_COLOR: {{ .Values.config.brand.primaryForegroundColor | quote }}
