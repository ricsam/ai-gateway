{{- if and (not .Values.secrets.existingSecret) (not .Values.postgresql.externalSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.fullname" . }}-secrets
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "ai-gateway.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required when bundled PostgreSQL is enabled" .Values.postgresql.password | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ required "secrets.values.authSecret is required when existingSecret is empty" .Values.secrets.values.authSecret | quote }}
  SETTINGS_ENCRYPTION_KEY: {{ required "secrets.values.settingsEncryptionKey is required when existingSecret is empty" .Values.secrets.values.settingsEncryptionKey | quote }}
{{- end }}
