replicaCount: 1
image:
  repository: ghcr.io/ricsam/ai-gateway
  tag: sha-5eac63c12341e0a0e9270dfd229e475ed5bd9e5c
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
service: { type: ClusterIP, port: 80 }
ingress:
  enabled: false
  className: traefik
  host: gateway.example.com
  annotations: {}
  path: /
  pathType: Prefix
config:
  baseUrl: https://gateway.example.com
  # Where the client's address is behind proxies, for sign-in rate limits and session records (docs/deployment/helm.mdx#client-ip-addresses).
  # Headers that a proxy sets to the client's address alone, read in order, such as [cf-connecting-ip] (CLIENT_IP_HEADERS).
  clientIpHeaders: []
  # Addresses or CIDR ranges of the proxies that append to X-Forwarded-For (TRUSTED_PROXIES).
  trustedProxies: []
secrets:
  existingSecret: ""
  keys:
    databaseUrl: DATABASE_URL
    authSecret: BETTER_AUTH_SECRET
    settingsEncryptionKey: SETTINGS_ENCRYPTION_KEY
  values:
    databaseUrl: ""
    authSecret: ""
    settingsEncryptionKey: ""
postgresql:
  enabled: false
  externalSecret: false
  image: timescale/timescaledb:2.19.3-pg17
  database: ai_gateway
  username: ai_gateway
  password: change-me
  persistence:
    size: 10Gi
    storageClass: rook-ceph-block
migration: { enabled: true, backoffLimit: 3 }
serviceAccount:
  create: true
  name: ""
  annotations: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
postgresqlResources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
