name: Release Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "helm-repository/**"
      - ".github/workflows/release-helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-helm-chart
  cancel-in-progress: false

jobs:
  release:
    name: Publish chart repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Lint chart
        run: helm lint charts/llm-proxy

      - name: Release chart repository snapshot
        uses: helm/chart-releaser-action@v1.7.0
        with:
          pages_branch: gh-pages
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish Helm repository server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: helm-repository/Dockerfile
          push: true
          build-args: |
            REPOSITORY_URL=https://helm-35xkhylwd67f.r5d.app
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-gateway-helm-repository:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ai-gateway-helm-repository:latest
