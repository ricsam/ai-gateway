name: Release Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release-helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-helm-chart
  cancel-in-progress: false

jobs:
  release:
    name: Publish chart repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Lint chart
        run: helm lint charts/ai-gateway

      - name: Release chart repository snapshot
        uses: helm/chart-releaser-action@v1.7.0
        with:
          pages_branch: gh-pages
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload chart repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages looks the artifact up once, and the artifact service can list a new artifact only seconds, at
      # times most of a minute, after its upload (actions/deploy-pages#451). A lookup that finds none fails before any
      # deployment is created, so deploy again after a minute. Re-running the job can't help: it uploads a second
      # github-pages artifact to the run, which deploy-pages refuses.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the artifact to be listed
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages again
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
