apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway-charts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-repository
  namespace: ai-gateway-charts
  labels:
    app.kubernetes.io/name: helm-repository
    app.kubernetes.io/part-of: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-repository
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-repository
        app.kubernetes.io/part-of: ai-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repository
          image: ghcr.io/ricsam/ai-gateway-helm-repository:chart-0.1.0-483c0384d87d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: helm-repository
  namespace: ai-gateway-charts
  labels:
    app.kubernetes.io/name: helm-repository
spec:
  selector:
    app.kubernetes.io/name: helm-repository
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helm-repository
  namespace: ai-gateway-charts
spec:
  ingressClassName: traefik
  rules:
    - host: helm-35xkhylwd67f.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helm-repository
                port:
                  number: 80
