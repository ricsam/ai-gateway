apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway-test
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  namespace: ai-gateway-test
type: Opaque
stringData:
  DATABASE_URL: postgres://llm_proxy:llm_proxy_test_password@postgres:5432/llm_proxy
  POSTGRES_PASSWORD: llm_proxy_test_password
  BETTER_AUTH_SECRET: test-placeholder-replaced-before-apply
  SETTINGS_ENCRYPTION_KEY: v1:test-placeholder-replaced-before-apply
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-gateway-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-gateway-test
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-gateway-test
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: llm_proxy
            - name: POSTGRES_DB
              value: llm_proxy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "llm_proxy", "-d", "llm_proxy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "llm_proxy", "-d", "llm_proxy"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-gateway-migrate-20260804141938
  namespace: ai-gateway-test
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ai-gateway-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/ricsam/ai-gateway-admin-test:20260804141938-browser-env-fix
          imagePullPolicy: Always
          command: ["bun", "run", "db:migrate"]
          envFrom:
            - secretRef:
                name: ai-gateway-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          image: ghcr.io/ricsam/ai-gateway-admin-test:20260804141938-browser-env-fix
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BASE_URL
              value: https://gateway-admin-35xkhylwd67f.r5d.app
          envFrom:
            - secretRef:
                name: ai-gateway-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-gateway-test
spec:
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway
  namespace: ai-gateway-test
spec:
  ingressClassName: traefik
  rules:
    - host: gateway-admin-35xkhylwd67f.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 80
